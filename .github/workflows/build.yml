name: Build and Release AU and VST3 Plugins

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Intel x86_64 / Universal)
            os: macos-13
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES='x86_64;arm64'"
            artifact_name: "HarmonicTremolo-macOS"
            archive_name: "HarmonicTremolo-v1.0.0-macOS.zip"

          - name: Windows (x64)
            os: windows-latest
            cmake_flags: ""
            artifact_name: "HarmonicTremolo-Windows"
            archive_name: "HarmonicTremolo-v1.0.0-Windows.zip"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build Plugins & Test Runner
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package macOS Artifacts (AU & VST3)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release_stage
          cp -R build/au_plugin/HarmonicTremolo_artefacts/Release/AU/*.component release_stage/ || true
          cp -R build/au_plugin/HarmonicTremolo_artefacts/Release/VST3/*.vst3 release_stage/ || true
          cp -R build/au_plugin/HarmonicTremolo_artefacts/Release/Standalone/*.app release_stage/ || true
          cd release_stage && zip -r ../${{ matrix.archive_name }} .

      - name: Package Windows Artifacts (VST3 & Standalone)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_stage
          Copy-Item -Path "build/au_plugin/HarmonicTremolo_artefacts/Release/VST3/*.vst3" -Destination "release_stage" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "build/au_plugin/HarmonicTremolo_artefacts/Release/Standalone/*.exe" -Destination "release_stage" -ErrorAction SilentlyContinue
          Compress-Archive -Path "release_stage/*" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload Artifact to Workflow Action
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "Tri-Verb Harmonic Tremolo v1.0.0 Release"
          body: |
            ## Tri-Verb Harmonic Tremolo v1.0.0 Release
            
            ### Included Plugins:
            - **macOS**: Audio Unit (`.component`) & VST3 (`.vst3`) for Intel (x86_64) and Apple Silicon ARM64.
            - **Windows**: VST3 (`.vst3`) 64-bit.
            - **Embedded DSP Block**: C source for Mooer GE series integration in `embedded/`.

            Automated build generated by GitHub Actions CI.
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
